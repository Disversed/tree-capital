<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Stravita Game — итоги</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
      ИНТЕГРАЦИЯ, ШАГ 1 (стили).
      Тот же CSS, что и в игре: он подтягивает ui_kit/main.css (шрифты, переменные, #stage/#game, .h1-.h3, .text...)
      и содержит готовые стили попапа (.popup-overlay, .popup-container, .close-popup-button, .popup-content...).
      В игре эту строку добавлять не нужно — она уже есть в index.html.
    -->
    <link rel="stylesheet" href="./styles/game_controls.css">

    <!--
      ИНТЕГРАЦИЯ, ШАГ 2 (стили).
      Весь блок <style> ниже ПЕРЕНЕСИТЕ в конец styles/game_controls.css
      (или в отдельный styles/result_screen.css и подключите через @import в game_controls.css).
    -->
    <style>
        /* ===== Финальный экран ===== */
        /* перекрывает всю игру, скроллится, если контент не помещается */
        .result-screen {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: var(--white);
            overflow-y: auto;
            padding: 32px 24px;
            display: none;
        }
        /* состояние - экран показан */
        .result-screen.is-open {
            display: flex;
            flex-direction: column;
            gap: var(--gap-16);
        }
        .result-head {
            display: flex;
            flex-direction: column;
            gap: var(--gap-16);
        }
        /* место под фото. Если фото не задано - серая заглушка */
        .result-photo {
            width: 100%;
            aspect-ratio: 327 / 127;
            background: #999 center / cover no-repeat;
            flex-shrink: 0;
        }
        /* карточка с накоплениями */
        .result-savings {
            background: var(--stravita-coolgray);
            border-radius: 5px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap-8);
        }
        .result-savings-value {
            display: flex;
            align-items: center;
            gap: var(--gap-8);
            font: 700 44px/normal var(--PTSans-font);
            color: var(--stravita-blue);
        }
        .result-share {
            display: flex;
            flex-direction: column;
            gap: var(--gap-16);
        }
        /* синяя кнопка на всю ширину */
        .blue-button {
            width: 100%;
            padding: 12px 16px;
            background: var(--stravita-blue);
            border: 2px solid var(--stravita-blue);
            color: var(--white);
            border-radius: 5px;
        }
        .blue-button:active {
            background: var(--white);
            color: var(--stravita-blue);
        }
        /* список ссылок */
        .result-links {
            display: flex;
            flex-direction: column;
            margin-top: var(--gap-8);
        }
        .result-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            color: var(--stravita-blue);
            text-decoration: none;
            border-bottom: 1px solid var(--stravita-lightgray);
        }
        /* стрелочка › */
        .result-link::after {
            content: "";
            width: 6px;
            height: 6px;
            border-top: 2px solid var(--stravita-blue);
            border-right: 2px solid var(--stravita-blue);
            transform: rotate(45deg);
            margin-right: 4px;
        }

        /* ===== Попап «Поделиться результатом» ===== */
        .share-text {
            white-space: pre-line; /* перенос строки из SHARE_CONFIG.text */
        }
        .share-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--gap-16);
            margin-top: var(--gap-16);
        }
        /* кнопки-ссылки соцсетей: стиль берём у .simple-green-button из игры */
        .share-buttons a {
            width: 100%;
            text-align: center;
            text-decoration: none;
        }
        /* кнопка «Вернуться к итогам» */
        .blue-border-button {
            width: 100%;
            padding: 10px 40px;
            background: var(--white);
            border: 2px solid var(--stravita-blue);
            color: var(--stravita-blue);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<!-- ИНТЕГРАЦИЯ, ШАГ 3: #stage / #game уже есть в index.html — в игре эти две обёртки НЕ копируем,
     а вставляем всё, что внутри них, в конец #game (после попапа щита) -->
<div id="stage">
    <div id="game">

        <!-- ========== ФИНАЛЬНЫЙ ЭКРАН (вставить в конец #game) ========== -->
        <section class="result-screen is-open" id="result-screen">
            <div class="result-head">
                <p class="text blue-text center-align-text">ИГРА ЗАВЕРШЕНА</p>
                <h1 class="h1 blue-text center-align-text">Ваше будущее<br>принесло плоды!</h1>
            </div>

            <!-- ТУТ ВНЕШНИЙ ВИД ДЕРЕВА, КАК ОНО ВЫГЛЯДЕЛО В КОНЦЕ ИГРЫ
             Место под фото. Задаётся в SHARE_CONFIG.photoUrl (см. скрипт) или прямо в CSS: background-image -->
            <div class="result-photo" id="result-photo"></div>

            <!-- Накопления. Число подставляется функцией showResultScreen({apples}) -->
            <div class="result-savings">
                <h3 class="h3 blue-text center-align-text">Ваши накопления</h3>
                <div class="result-savings-value">
                    <span id="result-apples">1250</span>
                    <!-- яблоко (то же, что в шапке игры, 40x40) -->
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.1984 35.8919C15.1887 36.5914 12.3033 36.1905 9.87669 33.4088C9.38513 32.8339 8.96522 32.2035 8.62583 31.5311C7.60013 29.4938 1.6252 19.6349 5.74886 13.0323C6.09122 12.5366 6.48376 12.0761 6.9205 11.6578C7.89199 10.7046 9.78496 7.23968 19.5125 9.74737C19.7251 9.866 23.2192 8.11103 27.1552 8.46284C28.1208 8.55942 29.0634 8.81239 29.9446 9.21147C32.1127 10.1687 37.775 13.2287 34.8771 22.6785C34.7722 23.0434 34.6941 23.4153 34.6437 23.7912C34.3726 25.6035 31.5624 33.8383 28.1851 34.9756C27.6152 35.2201 27.0585 35.4932 26.5173 35.7937C26.0497 36.0569 25.5266 36.2108 24.9886 36.2434C24.4506 36.2761 23.9122 36.1866 23.4151 35.9819C21.0969 34.9756 19.846 34.9756 17.1984 35.8919Z" fill="#D82525" stroke-width="1.875" stroke-miterlimit="10" stroke="#3C1108"/>
                        <path d="M14.2005 8.99899C15.5264 10.2835 20.2588 12.8607 25.4582 8.58991C22.4353 7.77174 21.2887 10.5535 16.2853 9.24444C15.8225 9.12581 13.8628 8.67173 14.2005 8.99899Z" fill="#3C1108"/>
                        <path d="M20.4553 10.6355V7.28097C20.4696 5.85888 20.0066 4.47168 19.1378 3.33331C18.918 3.04348 18.66 2.78349 18.3706 2.56014C17.1197 1.63561 16.3525 4.37647 16.3525 4.37647C16.3525 4.37647 18.0203 5.23146 18.4039 6.50371C18.7875 7.77596 18.7875 10.2264 19.0127 10.6355C19.2378 11.0445 20.4553 10.6355 20.4553 10.6355Z" fill="#3C1108"/>
                        <path d="M20.2634 5.05119C21.0973 3.11213 23.2863 -0.455081 27.9604 0.0480923C27.9604 0.371269 28.1021 7.48524 21.0765 6.49525C20.9165 6.47006 20.7644 6.40946 20.6319 6.31804C20.4993 6.22662 20.3897 6.10678 20.3113 5.96761C20.2329 5.82844 20.1879 5.6736 20.1796 5.51482C20.1713 5.35604 20.2 5.19748 20.2634 5.05119Z" fill="#296239"/>
                        <path d="M10.7941 13.3229C9.88099 13.9856 8.5259 15.3683 9.5933 17.3115C9.7806 17.652 10.0659 17.9309 10.4136 18.1135C10.7613 18.2961 11.1561 18.3742 11.5488 18.3383C12.5411 18.236 13.8212 17.6101 14.3507 15.2129C14.4196 14.9171 14.4124 14.6093 14.3299 14.317C14.1714 13.7811 13.6961 13.1143 12.2701 12.9383C11.7459 12.8736 11.2166 13.0115 10.7941 13.3229Z" fill="#FFD7E2"/>
                    </svg>
                </div>
            </div>

            <!-- Кнопка «Поделиться» -> открывает попап #share-popup -->
            <div class="result-share">
                <button class="blue-button text-btn" id="open-share-button">Поделиться в соцсетях</button>
                <p class="text center-align-text">Вдохновите друзей позаботиться о будущем</p>
            </div>

            <!-- Ссылки -->
            <h2 class="h2 blue-text center-align-text">Продолжите заботиться<br>о будущем со Стравита</h2>
            <nav class="result-links">
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://newclient.stravita.by/login/?next=/">Заключить договор онлайн</a>
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://stravita.by/programmy-straxovaniya/dobrovolnoe-straxovanie-dopolnitelnoj-nakopitelnoj-pensii/#calculator">Калькулятор ДНПС</a>
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://stravita.by/programmy-straxovaniya/straxovanie-zhizni/">Страхование жизни</a>
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://stravita.by/programmy-straxovaniya/detskoe-straxovanie/">Детское страхование</a>
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://stravita.by/programmy-straxovaniya/dobrovolnoe-straxovanie-dopolnitelnoj-nakopitelnoj-pensii/">Пенсионное страхование</a>
                <a class="result-link text" target="_blank" rel="noopener noreferrer" href="https://stravita.by/customer-support/tax-exemptions/">Налоговые льготы</a>
            </nav>
        </section>

        <!-- ========== ПОПАП «ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ» (вставить в конец #game, ПОСЛЕ попапа щита) ==========
             Стили .popup-overlay / .popup-container / .close-popup-button уже есть в игре.
             ВАЖНО: в тестовом скрипте игры (открытие попапа щита) замените
                 document.querySelector('.popup-overlay')
             на id попапа щита (добавьте ему id="shield-popup"), иначе скрипт может схватить не тот оверлей. -->
        <div class="popup-overlay" id="share-popup">
            <div class="popup-container">
                <button class="close-popup-button" id="close-share-button" aria-label="Закрыть">
                    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.7321 1.875L12.8036 12.8036M12.8036 12.8036L1.875 23.7321M12.8036 12.8036L1.87503 1.875M12.8036 12.8036L23.7321 23.7321" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round" stroke="#B2B2B2"/>
                    </svg>
                </button>
                <div class="popup-content">
                    <h2 class="h2 blue-text center-align-text">Поделиться результатом</h2>
                    <!-- текст поста (подставляется из SHARE_CONFIG.text) -->
                    <p class="text center-align-text share-text" id="share-text"></p>
                </div>
                <!-- кнопки соцсетей создаются скриптом из SHARE_CONFIG / NETWORKS -->
                <div class="share-buttons">
                    <div class="share-buttons" id="share-buttons" style="margin-top:0"></div>
                    <button class="blue-border-button text-btn" id="back-to-results-button">Вернуться к итогам</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!--
  ИНТЕГРАЦИЯ, ШАГ 4 (скрипт): перенесите этот <script> в конец body index.html (или в отдельный js-файл).
  Показать финальный экран из игры:   showResultScreen({ apples: 1250 });
-->
<script>
    /* ===================== НАСТРОЙКИ ПОСТА ===================== */
    const SHARE_CONFIG = {
        // Страница, на которую ведёт пост. На ней ДОЛЖНЫ быть og-теги (см. ниже), иначе соцсеть не покажет картинку.
        url: 'https://stravita.by/game/',
        // Картинка к посту, рекомендуется 1200x630, абсолютный https-адрес
        imageUrl: 'https://stravita.by/game/share.jpg',
        // Заголовок поста
        title: 'Игра Stravita: ваше будущее принесло плоды!',
        // Подпись. {apples} заменится на число яблок, \n — перенос строки
        text: 'Мой урожай — {apples} яблок!\nА сколько накопите вы?',
        // Фото на финальном экране (серый прямоугольник). Пусто — останется серая заглушка
        photoUrl: ''
    };

    // Какие соцсети показывать (порядок = порядок кнопок). Доступны: tg, vk, ok, wa
    const ENABLED_NETWORKS = ['tg', 'vk'];

    const enc = encodeURIComponent;
    const NETWORKS = {
        tg: { name: 'Telegram',   link: (c, t) => `https://t.me/share/url?url=${enc(c.url)}&text=${enc(t)}` },
        vk: { name: 'ВКонтакте',  link: (c, t) => `https://vk.com/share.php?url=${enc(c.url)}&title=${enc(c.title)}&comment=${enc(t)}&image=${enc(c.imageUrl)}&noparse=true` },
        ok: { name: 'Одноклассники', link: (c, t) => `https://connect.ok.ru/offer?url=${enc(c.url)}&title=${enc(t)}&imageUrl=${enc(c.imageUrl)}` },
        wa: { name: 'WhatsApp',   link: (c, t) => `https://wa.me/?text=${enc(t + '\n' + c.url)}` }
    };

    /* ===================== ЛОГИКА ===================== */
    const resultScreen = document.getElementById('result-screen');
    const sharePopup = document.getElementById('share-popup');
    const shareButtons = document.getElementById('share-buttons');
    let currentApples = 1250;

    // Показать финальный экран. Вызывать из игры по окончании: showResultScreen({ apples: 1250 })
    function showResultScreen({ apples }) {
        currentApples = apples;
        document.getElementById('result-apples').textContent = apples;
        if (SHARE_CONFIG.photoUrl) {
            document.getElementById('result-photo').style.backgroundImage = `url("${SHARE_CONFIG.photoUrl}")`;
        }
        renderShareButtons();
        resultScreen.classList.add('is-open');
    }

    // Собрать текст поста и кнопки-ссылки соцсетей
    function renderShareButtons() {
        const text = SHARE_CONFIG.text.replace('{apples}', currentApples.toLocaleString('ru-RU'));
        document.getElementById('share-text').textContent = text;
        shareButtons.innerHTML = '';
        ENABLED_NETWORKS.forEach((key) => {
            const net = NETWORKS[key];
            // обычная ссылка (а не window.open) — не блокируется браузерами
            const a = document.createElement('a');
            a.className = 'simple-green-button text-btn';
            a.href = net.link(SHARE_CONFIG, text);
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = net.name;
            shareButtons.appendChild(a);
        });
    }

    document.getElementById('open-share-button').addEventListener('click', () => {
        renderShareButtons();
        sharePopup.classList.add('is-open');
    });
    const closeShare = () => sharePopup.classList.remove('is-open');
    document.getElementById('close-share-button').addEventListener('click', closeShare);
    document.getElementById('back-to-results-button').addEventListener('click', closeShare);

    renderShareButtons();
</script>

<!--
  ВАЖНО ПРО КАРТИНКУ И ПОДПИСЬ В ПОСТЕ.
  Соцсети не принимают файл через ссылку «поделиться»: картинку и заголовок они берут со страницы SHARE_CONFIG.url
  из мета-тегов. Добавьте их в <head> этой страницы (stravita.by/game/):

  <meta property="og:title"       content="Игра Stravita: ваше будущее принесло плоды!">
  <meta property="og:description" content="Сыграйте и узнайте, сколько яблок принесёт ваше будущее">
  <meta property="og:image"       content="https://stravita.by/game/share.jpg">
  <meta property="og:url"         content="https://stravita.by/game/">
  <meta name="twitter:card"       content="summary_large_image">

  Подпись (text) передаётся напрямую в Telegram, WhatsApp, Одноклассники и ВКонтакте.
  Для ВКонтакте и Одноклассников картинку можно передать и параметром (imageUrl) — это уже сделано.
-->
</body>
</html>
